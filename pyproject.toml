[project]
name = "emsal-mcp"
version = "3.0.2"
description = "Citation-safe MCP hukuk araştırma ve belge hazırlık sistemi"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Emsal Team" },
]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.7",
  "python-docx>=1.1",
  "typer>=0.12",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
api = []
mcp = ["mcp>=1.0"]
udf = ["python-docx>=1.1"]  # LibreOffice is external
embeddings = ["fastembed>=0.4"]
ocr = ["pypdf>=4.0", "pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
emsal-mcp = "emsal_mcp.cli:app"
emsal-mcp-server = "emsal_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
