[project]
name = "emsal-mcp"
version = "4.0.0"
description = "Citation-safe MCP hukuk araştırma ve belge hazırlık sistemi"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Emsal Team" },
]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.7",
  "python-docx>=1.1",
  "typer>=0.12",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
api = []
mcp = ["mcp>=1.0,<2.0"]
udf = ["python-docx>=1.1"]  # LibreOffice is external
embeddings = ["fastembed>=0.4,<1.0"]
ocr = ["pypdf>=4.0,<6.0", "pillow>=10.0,<12.0"]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.5,<1.0", "mypy>=1.0,<2.0"]

[project.scripts]
emsal-mcp = "emsal_mcp.cli:app"
emsal-mcp-server = "emsal_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "unit: Fast unit tests (no DB/IO)",
    "integration: Tests requiring DB setup or network I/O",
]

[tool.ruff]
line-length = 100

# Docstring rules (D100/D101/D103) are intentionally excluded from the main
# gate — they are advisory only.  The gate requires 0 ruff errors on the
# default rule set (E/W/F).  See ROADMAP.md M-68 / FAZ E.
[tool.ruff.lint]
extend-ignore = ["D100", "D101", "D103", "E402"]  # D=advisory docstrings, E402=deliberate lazy imports (M-52)

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false  # too many untyped params still
warn_return_any = true
warn_unused_ignores = false
