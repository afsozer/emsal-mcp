[project]
name = "emsal-mcp"
version = "5.0.0"
description = "Citation-safe MCP hukuk araştırma ve belge hazırlık sistemi"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Emsal Team" },
]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  # Zincir doğrulaması için kök deposu. httpx zaten kuruyordu ama artık
  # doğrudan kullanıyoruz (sources/base.py: certifi + vendored ara sertifika).
  "certifi>=2024.2.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.7",
  "python-docx>=1.1",
  "typer>=0.12",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# www.mevzuat.gov.tr'nin göndermediği ara sertifika pakete girmeli; aksi hâlde
# wheel'den kurulan sürümde o kaynak TLS hatasıyla ölür.
[tool.setuptools.package-data]
emsal_mcp = ["certs/*.pem"]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2.0"]
udf = ["python-docx>=1.1"]  # LibreOffice is external
# >=0.6 required: TextEmbedding.add_custom_model() (used to register the
# multilingual-e5-small ONNX export, which fastembed does not ship natively)
# was added in 0.6.0 and is missing in 0.4.x/0.5.x.
embeddings = ["fastembed>=0.6,<1.0"]
ocr = ["pypdf>=4.0,<6.0", "pillow>=10.0,<12.0"]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.5,<1.0", "mypy>=1.0,<2.0"]

[project.scripts]
emsal-mcp = "emsal_mcp.cli:app"
emsal-mcp-server = "emsal_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "unit: Fast unit tests (no DB/IO)",
    "integration: Tests requiring DB setup or network I/O",
    "live: Hits the real upstream source; opt-in via EMSAL_LIVE_TESTS=1",
]

[tool.ruff]
line-length = 100

# Docstring rules (D100/D101/D103) are intentionally excluded from the main
# gate — they are advisory only.  The gate requires 0 ruff errors on the
# default rule set (E/W/F).  See ROADMAP.md M-68 / FAZ E.
[tool.ruff.lint]
extend-ignore = ["D100", "D101", "D103", "E402"]  # D=advisory docstrings, E402=deliberate lazy imports (M-52)

# Only a bare `_` (or `__`, ...) counts as an intentionally-unused local.
# The default regex also exempts every `_name`, which is how the dead
# `_fts5_narrowed` in Cache.search_local survived: it was assigned the FTS5
# candidate rowids and never read, so the index was queried and discarded
# while a full-table LIKE scan did the actual work.  F841 must see those.
dummy-variable-rgx = "^_+$"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false  # too many untyped params still
warn_return_any = true
warn_unused_ignores = false
